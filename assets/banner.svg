  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <circle cx="100" cy="60" r="120" fill="#ff5c2b" opacity="0.07"/>
  <circle cx="1120" cy="300" r="150" fill="#ffb400" opacity="0.06"/>
  <ellipse cx="950" cy="70" rx="90" ry="50" fill="#ff5c2b" opacity="0.08"/>
  <ellipse cx="220" cy="310" rx="140" ry="60" fill="#ffb400" opacity="0.05"/>
  <circle cx="600" cy="180" r="220" fill="#ffffff" opacity="0.03"/>

